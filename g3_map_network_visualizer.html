        // Specific color mapping as requested:
        // "风华绝代": Bright Amber/Gold (#f59e0b / #fbbf24)
        // "休闲娱乐": Bright Blue (#3b82f6 / #60a5fa)
        // "未开放" and "无": Unified Dark Gray (#6b7280 / #4b5563)
        // Distinct colors for other alliances
        const ownerColors = {
            "风华绝代": { bg: "#f59e0b", border: "#fbbf24", text: "#0f172a", highlightBg: "#fcd34d" }, // Bright Gold/Amber
            "休闲娱乐": { bg: "#3b82f6", border: "#60a5fa", text: "#ffffff", highlightBg: "#93c5fd" }, // Bright Blue
            "未开放":   { bg: "#4b5563", border: "#6b7280", text: "#9ca3af", highlightBg: "#6b7280" }, // Neutral Gray
            "无":       { bg: "#4b5563", border: "#6b7280", text: "#9ca3af", highlightBg: "#6b7280" }, // Neutral Gray (Same as 未开放)

            "花满楼":     { bg: "#ec4899", border: "#f472b6", text: "#ffffff", highlightBg: "#f472b6" }, // Pink
            "诸神的黄昏": { bg: "#8b5cf6", border: "#a78bfa", text: "#ffffff", highlightBg: "#a78bfa" }, // Purple
            "就一个":     { bg: "#10b981", border: "#34d399", text: "#ffffff", highlightBg: "#34d399" }, // Emerald Green
            "憾山阁":     { bg: "#84cc16", border: "#a3e635", text: "#ffffff", highlightBg: "#a3e635" }, // Lime
            "法天象地":   { bg: "#06b6d4", border: "#22d3ee", text: "#ffffff", highlightBg: "#22d3ee" }, // Cyan
            "西南大观楼": { bg: "#14b8a6", border: "#2dd4bf", text: "#ffffff", highlightBg: "#2dd4bf" }, // Teal
            "夏天":       { bg: "#f43f5e", border: "#fb7185", text: "#ffffff", highlightBg: "#fb7185" }, // Rose Red
            "猎鹰军团":   { bg: "#6366f1", border: "#818cf8", text: "#ffffff", highlightBg: "#818cf8" }, // Indigo
            "长安城":     { bg: "#d97706", border: "#f59e0b", text: "#ffffff", highlightBg: "#fbbf24" }, // Bronze
            "叶无眠":     { bg: "#0284c7", border: "#38bdf8", text: "#ffffff", highlightBg: "#38bdf8" }, // Sky Blue
            "我要验牌":   { bg: "#a855f7", border: "#c084fc", text: "#ffffff", highlightBg: "#c084fc" }  // Violet
        };

        function getOwnerColor(owner) {
            if (ownerColors[owner]) return ownerColors[owner];
            return { bg: "#64748b", border: "#94a3b8", text: "#ffffff", highlightBg: "#cbd5e1" };
        }

        // Global State & Vis.js Instances
        let network = null;
        let nodesDataSet = null;
        let edgesDataSet = null;
        let selectedNodeId = null;
        let adjacencyMap = {};

        // Calculate Ring Concentric Positioning for 85 Cities (L8 Center, L1 Perimeter)
        function calculatePositions() {
            const positions = {};
            const levelCounts = {};
            
            rawNodes.forEach(node => {
                levelCounts[node.level] = (levelCounts[node.level] || 0) + 1;
            });

            const levelIndices = {};

            rawNodes.forEach(node => {
                const lvl = node.level;
                if (!levelIndices[lvl]) levelIndices[lvl] = 0;
                
                const index = levelIndices[lvl]++;
                const total = levelCounts[lvl];
                
                // Ring radius based on level scale
                const radius = (8 - lvl) * 165; 
                const angleOffset = (lvl % 2 === 0) ? 0 : Math.PI / total;
                const angle = (index / total) * 2 * Math.PI + angleOffset;

                positions[node.id] = {
                    x: radius * Math.cos(angle),
                    y: radius * Math.sin(angle)
                };
            });

            return positions;
        }

        // Initialize App
        window.onload = function() {
            initAdjacencyMap();
            initNetwork();
            initLegend();
            initStatsHeader();
            setupEventListeners();
        };

        function initAdjacencyMap() {
            rawNodes.forEach(n => adjacencyMap[n.id] = new Set());
            rawEdges.forEach(e => {
                if (adjacencyMap[e.source]) adjacencyMap[e.source].add(e.target);
                if (adjacencyMap[e.target]) adjacencyMap[e.target].add(e.source);
            });
        }

        function initNetwork() {
            const positions = calculatePositions();

            // Node sizes: L8 = 42px (largest), L1 = 12px (smallest)
            // Font sizes match node scale: L8 = 22px, L1 = 10px
            const formattedNodes = rawNodes.map(n => {
                const colors = getOwnerColor(n.owner);
                const size = 10 + n.level * 4; 
                const fontSize = 9 + n.level * 1.6;
                const isFeatured = n.owner === '风华绝代' || n.owner === '休闲娱乐';

                return {
                    id: n.id,
                    label: n.id,
                    level: n.level,
                    owner: n.owner,
                    shape: 'dot',
                    size: size,
                    x: positions[n.id].x,
                    y: positions[n.id].y,
                    font: {
                        size: fontSize,
                        color: n.owner === '未开放' || n.owner === '无' ? '#9ca3af' : '#ffffff',
                        face: 'Inter, system-ui, sans-serif',
                        strokeWidth: 3,
                        strokeColor: '#0b1120'
                    },
                    color: {
                        background: colors.bg,
                        border: colors.border,
                        highlight: {
                            background: colors.highlightBg,
                            border: '#ffffff'
                        },
                        hover: {
                            background: colors.highlightBg,
                            border: '#ffffff'
                        }
                    },
                    borderWidth: isFeatured ? 3 : 1.5,
                    shadow: isFeatured ? { enabled: true, color: colors.bg, size: 14 } : false
                };
            });

            const formattedEdges = rawEdges.map((e, index) => ({
                id: `e_${index}`,
                from: e.source,
                to: e.target,
                color: {
                    color: '#334155',
                    highlight: '#38bdf8',
                    hover: '#64748b',
                    opacity: 0.5
                },
                width: 1.2,
                smooth: { type: 'continuous' }
            }));

            nodesDataSet = new vis.DataSet(formattedNodes);
            edgesDataSet = new vis.DataSet(formattedEdges);

            const container = document.getElementById('mynetwork');
            const data = { nodes: nodesDataSet, edges: edgesDataSet };
            
            const options = {
                nodes: {
                    borderWidthSelected: 4,
                },
                edges: {
                    selectionWidth: 2.5
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 100,
                    zoomView: true,
                    dragView: true
                },
                physics: {
                    enabled: true,
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -45,
                        centralGravity: 0.012,
                        springLength: 95,
                        springConstant: 0.07,
                        damping: 0.45
                    },
                    stabilization: {
                        iterations: 150,
                        updateInterval: 25
                    }
                }
            };

            network = new vis.Network(container, data, options);

            // Network Selection Handler
            network.on("selectNode", function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    handleNodeSelect(nodeId);
                }
            });

            network.on("deselectNode", function() {
                resetHighlights();
                showNoSelectionState();
            });

            network.on("doubleClick", function(params) {
                if (params.nodes.length > 0) {
                    network.focus(params.nodes[0], { scale: 1.3, animation: true });
                }
            });
        }

        // Highlight selected node + adjacent nodes & edges, dim non-connected
        function handleNodeSelect(nodeId) {
            selectedNodeId = nodeId;
            const neighbors = adjacencyMap[nodeId] || new Set();

            const updateNodes = [];
            nodesDataSet.forEach(node => {
                const isTarget = node.id === nodeId;
                const isNeighbor = neighbors.has(node.id);
                
                if (isTarget || isNeighbor) {
                    updateNodes.push({
                        id: node.id,
                        opacity: 1.0,
                        font: { opacity: 1.0 }
                    });
                } else {
                    updateNodes.push({
                        id: node.id,
                        opacity: 0.12,
                        font: { opacity: 0.12 }
                    });
                }
            });
            nodesDataSet.update(updateNodes);

            const updateEdges = [];
            edgesDataSet.forEach(edge => {
                const isConnected = (edge.from === nodeId && neighbors.has(edge.to)) || 
                                    (edge.to === nodeId && neighbors.has(edge.from));
                if (isConnected) {
                    updateEdges.push({
                        id: edge.id,
                        color: { color: '#fbbf24', opacity: 1.0 },
                        width: 3
                    });
                } else {
                    updateEdges.push({
                        id: edge.id,
                        color: { color: '#1e293b', opacity: 0.05 },
                        width: 1
                    });
                }
            });
            edgesDataSet.update(updateEdges);

            renderCityDetails(nodeId);
        }

        function resetHighlights() {
            selectedNodeId = null;
            
            const updateNodes = [];
            nodesDataSet.forEach(node => {
                updateNodes.push({
                    id: node.id,
                    opacity: 1.0,
                    font: { opacity: 1.0 }
                });
            });
            nodesDataSet.update(updateNodes);

            const updateEdges = [];
            edgesDataSet.forEach(edge => {
                updateEdges.push({
                    id: edge.id,
                    color: { color: '#334155', opacity: 0.5 },
                    width: 1.2
                });
            });
            edgesDataSet.update(updateEdges);

            document.getElementById('allianceFilter').value = 'ALL';
        }

        function renderCityDetails(nodeId) {
            const node = rawNodes.find(n => n.id === nodeId);
            if (!node) return;

            document.getElementById('noSelectionState').classList.add('hidden');
            document.getElementById('cityDetailCard').classList.remove('hidden');

            document.getElementById('cityName').textContent = `城池 ${node.id}`;
            document.getElementById('cityLevelBadge').textContent = `等级 ${node.level} 城池`;
            document.getElementById('levelScaleText').textContent = `${node.level} 级 (${node.level === 8 ? '皇城核心' : node.level >= 5 ? '高阶要塞' : '常规定居点'})`;
            
            const ownerEl = document.getElementById('cityOwner');
            ownerEl.textContent = node.owner;
            const colors = getOwnerColor(node.owner);
            ownerEl.style.backgroundColor = colors.bg;
            ownerEl.style.color = colors.text;

            const neighbors = Array.from(adjacencyMap[nodeId] || []);
            document.getElementById('neighborCount').textContent = `${neighbors.length} 个城池`;
            document.getElementById('tierInfo').textContent = `第 ${9 - node.level} 圈层`;

            const neighborsContainer = document.getElementById('neighborsList');
            neighborsContainer.innerHTML = '';

            neighbors.sort((a, b) => a.localeCompare(b, undefined, {numeric: true})).forEach(nId => {
                const neighborNode = rawNodes.find(n => n.id === nId);
                if (!neighborNode) return;
                const nColor = getOwnerColor(neighborNode.owner);
                
                const chip = document.createElement('button');
                chip.className = 'px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs flex items-center gap-1.5 transition-colors';
                chip.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${nColor.bg}"></span>
                    <span class="font-mono font-bold text-slate-200">${nId}</span>
                    <span class="text-[10px] text-slate-400">(${neighborNode.owner})</span>
                `;
                chip.onclick = () => {
                    network.selectNodes([nId]);
                    handleNodeSelect(nId);
                    network.focus(nId, { animation: true });
                };
                neighborsContainer.appendChild(chip);
            });

            document.getElementById('sidebar').classList.remove('translate-x-full');
        }

        function showNoSelectionState() {
            document.getElementById('noSelectionState').classList.remove('hidden');
            document.getElementById('cityDetailCard').classList.add('hidden');
        }

        function initLegend() {
            const ownerCounts = {};
            rawNodes.forEach(n => {
                ownerCounts[n.owner] = (ownerCounts[n.owner] || 0) + 1;
            });

            const sortedOwners = Object.keys(ownerCounts).sort((a, b) => {
                if (a === '风华绝代') return -1;
                if (b === '风华绝代') return 1;
                if (a === '休闲娱乐') return -1;
                if (b === '休闲娱乐') return 1;
                if (a === '未开放' || a === '无') return 1;
                if (b === '未开放' || b === '无') return -1;
                return ownerCounts[b] - ownerCounts[a];
            });

            const legendGrid = document.getElementById('legendGrid');
            legendGrid.innerHTML = '';

            sortedOwners.forEach(owner => {
                const color = getOwnerColor(owner);
                const count = ownerCounts[owner];
                const isFeatured = owner === '风华绝代' || owner === '休闲娱乐';

                const legendItem = document.createElement('div');
                legendItem.className = `flex items-center justify-between p-1.5 rounded-lg border cursor-pointer transition-all ${
                    isFeatured 
                    ? 'bg-slate-800 border-slate-600 font-bold hover:border-slate-400' 
                    : 'bg-slate-900/60 border-slate-800 hover:bg-slate-800/60 text-slate-400'
                }`;

                legendItem.innerHTML = `
                    <div class="flex items-center gap-1.5 overflow-hidden">
                        <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${color.bg}"></span>
                        <span class="truncate ${isFeatured ? 'text-slate-100' : ''}">${owner}</span>
                    </div>
                    <span class="text-[10px] font-mono px-1.5 py-0.2 rounded bg-slate-800 text-slate-300 border border-slate-700">${count}</span>
                `;

                legendItem.onclick = () => {
                    document.getElementById('allianceFilter').value = owner;
                    filterByOwner(owner);
                };

                legendGrid.appendChild(legendItem);
            });
        }

        // Filter Network Display by Alliance
        function filterByOwner(owner) {
            if (owner === 'ALL') {
                resetHighlights();
                return;
            }

            const updateNodes = [];
            nodesDataSet.forEach(node => {
                const matches = (owner === '无') ? (node.owner === '无' || node.owner === '未开放') : (node.owner === owner);
                updateNodes.push({
                    id: node.id,
                    opacity: matches ? 1.0 : 0.08,
                    font: { opacity: matches ? 1.0 : 0.08 }
                });
            });
            nodesDataSet.update(updateNodes);

            const updateEdges = [];
            edgesDataSet.forEach(edge => {
                updateEdges.push({
                    id: edge.id,
                    color: { opacity: 0.03 },
                    width: 1
                });
            });
            edgesDataSet.update(updateEdges);
        }

        function initStatsHeader() {
            let fh = 0, xx = 0;
            rawNodes.forEach(n => {
                if (n.owner === '风华绝代') fh++;
                if (n.owner === '休闲娱乐') xx++;
            });
            document.getElementById('count-fh').textContent = fh;
            document.getElementById('count-xx').textContent = xx;
            document.getElementById('count-total').textContent = rawNodes.length;
        }

        function setupEventListeners() {
            document.getElementById('zoomInBtn').onclick = () => {
                const scale = network.getScale();
                network.moveTo({ scale: scale * 1.3, animation: true });
            };

            document.getElementById('zoomOutBtn').onclick = () => {
                const scale = network.getScale();
                network.moveTo({ scale: scale * 0.7, animation: true });
            };

            document.getElementById('resetZoomBtn').onclick = () => {
                network.fit({ animation: true });
                resetHighlights();
                showNoSelectionState();
            };

            document.getElementById('clearHighlightBtn').onclick = () => {
                resetHighlights();
                showNoSelectionState();
                network.unselectNodes();
            };

            document.getElementById('allianceFilter').onchange = (e) => {
                filterByOwner(e.target.value);
            };

            const sidebar = document.getElementById('sidebar');
            document.getElementById('toggleSidebarBtn').onclick = () => {
                sidebar.classList.toggle('translate-x-full');
            };
            document.getElementById('closeSidebarBtn').onclick = () => {
                sidebar.classList.add('translate-x-full');
            };

            // Search Bar
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');

            // Helper function to focus and select city by ID
            function selectAndFocusCity(cityId) {
                const targetNode = rawNodes.find(n => n.id.toLowerCase() === cityId.toLowerCase());
                if (!targetNode) return false;

                const actualId = targetNode.id;
                searchInput.value = actualId;
                searchResults.classList.add('hidden');
                
                network.selectNodes([actualId]);
                handleNodeSelect(actualId);
                network.focus(actualId, { scale: 1.3, animation: true });
                return true;
            }

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const query = searchInput.value.trim().toLowerCase();
                    if (!query) return;

                    // 1. Try exact match first
                    let success = selectAndFocusCity(query);
                    
                    // 2. If not exact, pick the first matching result
                    if (!success) {
                        const firstMatch = rawNodes.find(n => 
                            n.id.toLowerCase().includes(query) || 
                            n.owner.toLowerCase().includes(query)
                        );
                        if (firstMatch) {
                            selectAndFocusCity(firstMatch.id);
                        }
                    }
                }
            });

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                if (!query) {
                    searchResults.classList.add('hidden');
                    return;
                }

                const matches = rawNodes.filter(n => 
                    n.id.toLowerCase().includes(query) || 
                    n.owner.toLowerCase().includes(query)
                ).slice(0, 8);

                if (matches.length > 0) {
                    searchResults.innerHTML = matches.map(n => {
                        const color = getOwnerColor(n.owner);
                        return `
                            <div class="px-3 py-2 hover:bg-slate-700 cursor-pointer flex items-center justify-between text-xs" data-id="${n.id}">
                                <div class="flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full" style="background-color:${color.bg}"></span>
                                    <span class="font-bold text-slate-100">城池 ${n.id}</span>
                                </div>
                                <span class="text-slate-400 text-[11px]">${n.owner} (L${n.level})</span>
                            </div>
                        `;
                    }).join('');

                    searchResults.classList.remove('hidden');

                    searchResults.querySelectorAll('div[data-id]').forEach(el => {
                        el.onclick = () => {
                            const targetId = el.getAttribute('data-id');
                            selectAndFocusCity(targetId);
                        };
                    });
                } else {
                    searchResults.innerHTML = `<div class="px-3 py-2 text-xs text-slate-400">未找到相关城池</div>`;
                    searchResults.classList.remove('hidden');
                }
            });

            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                    searchResults.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
